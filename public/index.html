<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d3b3e" />
    <title>가까운 전기차 충전소</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="top-panel" aria-labelledby="page-title">
        <div class="title-row">
          <div>
            <p class="eyebrow">NEARBY EV</p>
            <h1 id="page-title">가까운 충전소</h1>
          </div>
          <button class="icon-button" id="refresh-location" type="button" aria-label="현재 위치 새로고침">
            <span aria-hidden="true">⌖</span>
          </button>
        </div>

        <div class="location-card" aria-live="polite">
          <div>
            <span class="label">현재 위치</span>
            <strong id="location-summary">위치 확인 중</strong>
          </div>
          <span class="accuracy" id="location-accuracy">-</span>
        </div>

        <div class="filter-bar" aria-label="충전소 필터">
          <div class="segmented" role="group" aria-label="충전 속도">
            <button class="segment is-active" type="button" data-speed="all" aria-pressed="true">전체</button>
            <button class="segment" type="button" data-speed="fast" aria-pressed="false">급속</button>
            <button class="segment" type="button" data-speed="slow" aria-pressed="false">완속</button>
          </div>

          <label class="toggle">
            <input id="available-only" type="checkbox" />
            <span class="switch" aria-hidden="true"></span>
            <span>충전 가능</span>
          </label>
        </div>
      </header>

      <section class="map-panel" aria-label="충전소 지도">
        <div class="map-canvas" id="map-canvas">
          <div class="naver-map-root" id="naver-map" aria-hidden="true"></div>

          <div class="map-controls" aria-label="지도 확대 축소">
            <button class="icon-button compact" id="zoom-in" type="button" aria-label="지도 확대">+</button>
            <button class="icon-button compact" id="zoom-out" type="button" aria-label="지도 축소">−</button>
          </div>

          <div class="map-state" id="map-state" role="status" aria-live="polite">네이버 지도를 준비 중입니다.</div>
        </div>

        <section class="bottom-sheet" id="bottom-sheet" aria-labelledby="results-title">
          <button
            class="sheet-handle"
            id="sheet-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="station-list"
          >
            <span aria-hidden="true"></span>
          </button>

          <div class="results-heading">
            <div>
              <h2 id="results-title">주변 충전소</h2>
              <p id="result-count">-</p>
            </div>
            <p class="data-state" id="data-state">샘플 데이터</p>
          </div>

          <div class="list" id="station-list" aria-live="polite"></div>
        </section>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./config.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
